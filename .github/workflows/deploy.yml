# https://blog.elmah.io/deploying-a-mkdocs-documentation-site-with-github-actions/
on:
  push:
    branches: [master]

jobs:
  build:
    name: Deploy to GitHub pages
    runs-on: ubuntu-22.04
    env:
      POETRY_KEYRING_ENABLED: "false"
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -U pip && python -m pip install -q "poetry==2.3.0"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev pkg-config
          sudo rm -rf /var/lib/apt/lists/*
      - run: poetry config virtualenvs.create false --local
      - run: poetry install
      - uses: actions/checkout@v4
        with:
          repository: jeeves-sh/mkdocs-material-insiders
          path: mkdocs-material-insiders
          token: ${{ secrets.INSIDERS_TOKEN }}

      - run: j install-graphviz
      - run: j install-mkdocs-insiders
      - run: j deploy-to-github-pages
